server {
    listen 80;
    server_name gabrielwaltrich.dev www.gabrielwaltrich.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gabrielwaltrich.dev www.gabrielwaltrich.dev;

    ssl_certificate /etc/letsencrypt/live/gabrielwaltrich.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabrielwaltrich.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
